<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="897" height="588" viewBox="0 0 897 588"
     role="img" aria-labelledby="title description">
  <title id="title">Ilustrasi Toko Sadam</title>
  <desc id="description">Ilustrasi fasad toko sederhana dengan atap segitiga, kanopi hijau, pintu bertuliskan Toko, jendela, dan tulisan Toko Sadam di bagian bawah.</desc>

  <!-- Latar belakang -->
  <rect width="897" height="588" fill="#eef4ec"/>

  <!-- Matahari -->
  <circle cx="732.5" cy="117.5" r="59.5" fill="#e9d49f"/>

  <!-- Atap toko -->
  <path d="M126 248 L448 94 L770 248 Z"
        fill="#fffdf8" stroke="#245c45" stroke-width="13"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Kanopi depan -->
  <path d="M101 248 H795 L776 300 V359 H120 V300 Z"
        fill="#245c45"/>

  <!-- Bagian dinding utama -->
  <path d="M126 300 V540 H770 V300"
        fill="#fffdf8" stroke="#245c45" stroke-width="13"
        stroke-linejoin="round"/>

  <!-- Garis pembagi kanopi -->
  <g stroke="#d8e7dc" stroke-width="7">
    <path d="M178 248 V354"/>
    <path d="M295 248 V354"/>
    <path d="M405 248 V354"/>
    <path d="M519 248 V354"/>
    <path d="M633 248 V354"/>
  </g>

  <!-- Lis bawah kanopi -->
  <path d="M133 353.5 H789" stroke="#173e30" stroke-width="11"
        stroke-linecap="square"/>

  <!-- Jendela depan -->
  <rect x="411" y="385" width="299" height="155" rx="8"
        fill="#e8f0e8" stroke="#245c45" stroke-width="10"/>
  <path d="M510.5 390 V540" stroke="#245c45" stroke-width="9"/>
  <path d="M412 454.5 H709" stroke="#245c45" stroke-width="9"/>

  <!-- Papan nama toko -->
  <rect x="192" y="385" width="185" height="155" rx="7"
        fill="#d8a84e"/>
  <rect x="226" y="412" width="117" height="52" rx="11"
        fill="#fff8e9"/>
  <text x="284.5" y="446" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27" font-weight="700" fill="#245c45">TOKO</text>

  <!-- Nama toko pada bagian bawah ilustrasi -->
  <text x="448.5" y="581" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="26" font-weight="700" fill="#155b49">TOKO SADAM</text>
</svg>
